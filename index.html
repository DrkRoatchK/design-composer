<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Composer</title>
<!--
  LYON SPARK · forma: composer (mecanismo v5 · orden E19: el Composer fácil · v4 en mecanismo_v4_respaldo.html)
  E19: izquierda = capas (arriba) + LA COLUMNA (abajo) que cambian los botones Plantillas · Textos · Props · Imágenes (o el DAM en ventana flotante ⧉);
       derecha = la pieza grande; arrastrar en la pieza (y del DAM a la pieza); deslizador de PROFUNDIDAD Z de la capa; subir tipografías (woff2/ttf/otf,
       se quedan en esta compu); MOCKUP (MC-MOCKUP): laptop · celular · PC + una imagen, con giro e inclinación → capa o prop nuevo.
       Zonas: lámina composer_hud › disposicion (si no viene, las de E5).
  LEY + DATOS = ARTEFACTO. No trae datos ni marca propios. Dos maneras de hornearlo:
    · manos/construir_composer.py  → mete la RAMA (tablas del Composer + catálogo del DAM + lámina del HUD) en el hueco de la rama:
                                       abre sin servidor, en cualquier compu.
    · manos/construir_cruce.py     → deja ese hueco sin llenar: la cara pide os_semilla.json al abrirse (como el v3).
  El v3 queda en mecanismo_v3_respaldo.html. Lo que cambió (sin rehacer lo que ya servía):
    1. el ÁRBOL ya no se rehace en cada cambio: es EL DISEÑO. Nace de una receta (plantilla o lienzo) y luego se edita
       capa por capa (mover y escalar en la pieza, campos en la ficha, subir/bajar en Z, duplicar, quitar).
    2. INVENTARIO del DAM por estantes (composer_estantes): Plantillas · Originales · Limpias · Editadas · Design · Corp ·
       Publicidad · Props · Por clasificar. Toca un activo → su ficha flotante → «Poner en la pieza» (capa MC-IMAGEN).
       También «Traer de tu compu» (la imagen viaja dentro del diseño).
    3. GUARDAR / ABRIR el diseño como JSON local (liviano: el DAM por ruta · portátil: con las imágenes dentro) y un
       autoguardado en este navegador. Karen revisa también lo que se abre.
    4. PIEL de la lámina composer_hud: placa + nodos PNG en sus zonas %, con z. Sin piel, las mismas zonas acomodan la cara.
    5. Teléfono (≤ 760 px): la pieza al centro y las ventanas como hojas que suben desde el dique de abajo.
  El árbol tiene la forma de davar/ir.py (tag · text · role · classes · attrs · data · children · nid): fondo + capas,
  data.z y data.caja en fracciones (LC-UNIDAD). manos/composer_arbol.py lee el mismo árbol (o el diseño guardado).
  Obedece la ley de interfaz de la semilla: JG-* · RI-* · MV-* · ST-* · CP-0 piso · CP-1 pieza · CP-2 HUD · CP-4 ventanas · CP-6 aviso.
-->
<style>
:root{
  --bg-void:#0e1117;--bg-panel:#1b212c;--line:#2a3140;--txt:#ece7dc;--txt-dim:#8f97a6;
  --blue:#d4b24c;--blue-glow:rgba(212,178,76,.35);--good:#37c7b5;--bad:#e2635c;
  --c-std:cubic-bezier(.4,0,.2,1);--c-sal:cubic-bezier(0,0,.2,1);--c-ent:cubic-bezier(.4,0,1,1);--c-enf:cubic-bezier(.2,0,0,1);
  --d-micro:90ms;--d-rap:140ms;--d-mod:200ms;--d-std:280ms;--d-del:420ms;
  --mono:ui-monospace,'Cascadia Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace;
  --disp:'Bahnschrift','DIN Alternate','Inter Display','Arial Narrow',system-ui,sans-serif;
  --glifo:'Segoe UI Historic','Noto Sans Phoenician',system-ui,sans-serif;
}

:root{--acc:var(--blue);--acc-glow:var(--blue-glow);--ink:var(--bg-void);--crema:var(--txt);--panel:var(--bg-panel);--sombra:6px 6px 0 #000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--crema);font:14px/1.4 system-ui,'Segoe UI',sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.g{font-family:var(--glifo)}
kbd{font:800 11px var(--mono)}

/* ── CP-0 · el mundo: placa del HUD (si la lámina está lista) o tinta con grano + piso ── */
.app{position:fixed;inset:0;overflow:hidden}
.app::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(236,231,220,.05) 0 1.2px,transparent 1.6px) 0 0/22px 22px;pointer-events:none}
.placa-hud{position:absolute;inset:0;background:center/100% 100% no-repeat;pointer-events:none}
#nodosHud{position:absolute;inset:0;z-index:0;pointer-events:none}   /* CP-0: la piel queda debajo de las ventanas vivas */
.nodo-hud{position:absolute;pointer-events:none;width:calc(var(--w)*1vw);height:calc(var(--h)*1vh);left:calc(var(--x)*1vw);top:calc(var(--y)*1vh)}
.resplandor{position:absolute;inset:0;background:radial-gradient(ellipse 42% 50% at 50% 50%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%);pointer-events:none}
.piso{position:absolute;left:-20%;right:-20%;bottom:-160px;height:560px;pointer-events:none;
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--acc) 20%,transparent) 0 1px,transparent 1px 84px),
             repeating-linear-gradient(0deg,color-mix(in srgb,var(--acc) 20%,transparent) 0 1px,transparent 1px 84px);
  transform:perspective(620px) rotateX(72deg);transform-origin:50% 0;-webkit-mask:linear-gradient(transparent,#000 45%);mask:linear-gradient(transparent,#000 45%)}
.con-piel .resplandor,.con-piel .piso,.con-piel.app::before{display:none}
.agua{position:absolute;left:50%;top:46%;transform:translate(-50%,-56%) rotate(-8deg);font:900 clamp(70px,7.6vw,150px)/.82 var(--disp);font-stretch:condensed;
  text-transform:uppercase;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--crema) 9%,transparent);white-space:nowrap;text-align:center;pointer-events:none}

/* ── zonas: la lámina composer_hud dice dónde vive cada parte (x, y, w, h en % de la pantalla) ── */
.zona{position:absolute;left:calc(var(--x)*1vw);top:calc(var(--y)*1vh);width:calc(var(--w)*1vw);height:calc(var(--h)*1vh)}
#zCapas{--x:1.5;--y:2;--w:19;--h:40}
#zInventario{--x:1.5;--y:44;--w:19;--h:54}
#formatos{--x:24;--y:1.5;--w:52;--h:7}
#mesa{--x:23;--y:11;--w:54;--h:66}
#zTiempo{--x:30;--y:78.5;--w:40;--h:5}
#zAcciones{--x:22;--y:86;--w:56;--h:11}
#karenBox{--x:79;--y:2;--w:19.5;--h:22}
#ficha{--x:79;--y:26;--w:19.5;--h:72}
.panel{background:var(--panel);border:1px solid var(--line);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.con-piel .panel{background:color-mix(in srgb,var(--panel) 40%,transparent);border-color:transparent}
.cab{font:800 10px var(--mono);letter-spacing:.24em;color:var(--txt-dim);display:flex;justify-content:space-between;align-items:center;gap:8px}
.cerrar-hoja{display:none}

/* ── CP-2 · título + capas (arriba a la izquierda) ─────────────────────── */
#zCapas{display:flex;flex-direction:column;gap:10px;padding:14px 10px 10px 14px;overflow:hidden}
.titulo{transform:rotate(-3deg);transform-origin:0 0}
.titulo .rueda{display:inline-block;margin-right:6px;background:var(--acc);color:var(--ink);font:800 10px var(--mono);letter-spacing:.16em;padding:4px 8px;text-decoration:none}
.titulo small{display:inline-block;background:var(--crema);color:var(--ink);font:800 10px var(--mono);letter-spacing:.14em;padding:4px 8px;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.titulo h1{font:900 clamp(26px,2.6vw,46px)/.86 var(--disp);font-stretch:condensed;text-transform:uppercase;letter-spacing:-.02em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titulo h1 span{display:block;color:var(--acc)}
.capas{display:flex;flex-direction:column;gap:5px;overflow:auto;min-height:0;flex:1;padding:2px 14px 6px 2px}
.it{position:relative;display:flex;align-items:center;gap:10px;min-height:36px;padding:4px 14px 4px 10px;background:var(--panel);text-align:left;
  clip-path:polygon(0 0,100% 6%,97% 100%,1.5% 94%);font:900 17px/1 var(--disp);font-stretch:condensed;text-transform:uppercase;
  transition:transform var(--d-mod) var(--c-sal),background var(--d-micro),color var(--d-micro)}
.it .g{width:22px;text-align:center;font-size:17px;color:var(--acc);flex:none}
.it .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{font:800 11px var(--mono);color:var(--txt-dim);flex:none}
.it:hover{transform:translateX(5px)}
.it.on{background:var(--crema);color:var(--ink);transform:translateX(12px) scale(1.03)}
.it.on .g,.it.on small{color:var(--ink)}
.it.mal{background:var(--bad);color:var(--crema)}.it.mal .g,.it.mal small{color:var(--crema)}
.it.on.mal{background:var(--crema);color:var(--bad)}

/* ── inventario del DAM (bolsa de RPG): estantes · buscador · rejilla ─── */
#zInventario{display:flex;flex-direction:column;gap:8px;padding:14px 12px 12px}
#zInventario .cab b{color:var(--acc)}
.estantes{display:flex;flex-wrap:wrap;gap:5px}
.est{height:28px;padding:0 9px;border-radius:8px;background:var(--ink);border:1px solid var(--line);font:800 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.est i{font-style:normal;color:var(--txt-dim);margin-left:5px}
.est.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}.est.on i{color:var(--ink)}
.est.sin{opacity:.45}
.busca{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--ink);color:var(--crema);padding:0 10px;user-select:text}
.rejas{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;overflow:auto;min-height:0;flex:1;align-content:start;padding:2px 4px 4px 2px}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;padding:5px;border-radius:10px;background:var(--ink);border:1px solid var(--line);text-align:left;transition:transform var(--d-micro),border-color var(--d-micro)}
.tile:hover{transform:translateY(-2px);border-color:var(--acc)}
.tile .mini{aspect-ratio:1;border-radius:7px;background:#0a0c10 center/contain no-repeat;display:grid;place-items:center;overflow:hidden;
  background-image:linear-gradient(45deg,#151a22 25%,transparent 25%,transparent 75%,#151a22 75%),linear-gradient(45deg,#151a22 25%,transparent 25%,transparent 75%,#151a22 75%);background-size:12px 12px;background-position:0 0,6px 6px}
.tile .mini img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.tile .mini.falta{background:repeating-linear-gradient(-45deg,#1b212c 0 6px,#141922 6px 12px);font:800 9px var(--mono);color:var(--txt-dim);text-align:center;padding:4px;letter-spacing:.06em}
.tile b{font:800 10px/1.15 system-ui,sans-serif;max-height:2.3em;overflow:hidden;word-break:break-word}
.tile em{position:absolute;top:8px;left:8px;font:800 8px var(--mono);font-style:normal;background:var(--crema);color:var(--ink);padding:1px 4px;border-radius:3px;letter-spacing:.06em}
.tile.traer .mini{background:var(--panel);border:2px dashed var(--acc);color:var(--acc);font:900 26px var(--disp)}
.tile.plant .mini{background:none;display:flex;flex-direction:column;align-items:stretch;padding:6px;gap:3px}
.tile.plant .mini i{flex:1;border-radius:4px}
.nada{grid-column:1/-1;color:var(--txt-dim);font:600 12px system-ui;padding:10px 2px}

/* ── formatos: riel arriba al centro (minimapa · Q / R) ───────────────── */
#formatos{display:flex;align-items:center;gap:8px;overflow-x:auto;overflow-y:hidden;padding:0 6px;scrollbar-width:none}
#formatos .q{width:26px;height:26px;flex:none;border-radius:50%;background:var(--crema);color:var(--ink);display:grid;place-items:center}
.fm{display:flex;align-items:center;gap:7px;height:36px;flex:none;padding:0 11px;background:var(--panel);border-radius:11px;font:900 13px var(--disp);font-stretch:condensed;
  text-transform:uppercase;transition:transform var(--d-mod) var(--c-sal)}
.fm .marco{border:2px solid currentColor;border-radius:2px;opacity:.7}
.fm:hover{transform:translateY(-2px)}
.fm.on{background:var(--crema);color:var(--ink);transform:rotate(-4deg) translateY(-2px);box-shadow:4px 4px 0 #000}
.fm.frena{background:var(--bad);color:var(--crema)}

/* ── CP-1 · el escenario: pedestal + pila ─────────────────────────────── */
.mesa .escena{position:absolute;inset:0;display:grid;place-items:center;perspective:1600px}
.pedestal{position:absolute;left:50%;bottom:-20px;width:min(92%,560px);height:80px;transform:translateX(-50%);border-radius:50%;pointer-events:none;
  border:2px solid color-mix(in srgb,var(--acc) 60%,transparent);box-shadow:0 0 60px var(--acc-glow),inset 0 0 40px var(--acc-glow);transition:opacity var(--d-std)}
.pedestal::after{content:'';position:absolute;inset:14px 14%;border-radius:50%;border:1px dashed color-mix(in srgb,var(--crema) 40%,transparent)}
.con-piel .pedestal{opacity:0}
.explotada .pedestal{opacity:.35}
.pila{position:relative;transform-style:preserve-3d;transition:transform var(--d-del) var(--c-enf);touch-action:none}
.pila canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:3px;cursor:pointer;transition:transform var(--d-del) var(--c-enf),opacity var(--d-std) var(--c-std),box-shadow var(--d-std) var(--c-std)}
.pila canvas.fondo{box-shadow:0 50px 90px -30px #000,0 0 0 1px rgba(255,255,255,.08)}
.pila.arrastra canvas{transition:none}
.pila.arrastra{cursor:grabbing}
.explotada .pila canvas:not(.fondo){background:color-mix(in srgb,var(--crema) 6%,transparent)}
.pila .etq{position:absolute;left:100%;top:50%;width:1px;height:1px;pointer-events:none;transition:transform var(--d-del) var(--c-enf)}
.marcas{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d;transition:transform var(--d-del) var(--c-enf)}
.marcas div{position:absolute;border:2px dashed var(--acc);border-radius:4px;opacity:0;transition:opacity var(--d-rap)}
.marcas div.on{opacity:1}
.marcas div.mal{opacity:1;border-color:var(--bad);border-style:solid;background:repeating-linear-gradient(-45deg,rgba(226,99,92,.18) 0 6px,transparent 6px 12px)}
.marcas .asa{display:none;position:absolute;right:-11px;bottom:-11px;width:22px;height:22px;background:var(--acc);border:3px solid var(--ink);transform:rotate(45deg);cursor:nwse-resize;pointer-events:auto;touch-action:none}
.marcas div.on.mueve .asa{display:block}
.explotada .marcas .asa{display:none!important}
.reticula{position:absolute;inset:-12px;pointer-events:none}
.reticula i{position:absolute;width:16px;height:16px;border:0 solid var(--acc)}
.reticula i:nth-child(1){left:0;top:0;border-width:3px 0 0 3px}.reticula i:nth-child(2){right:0;top:0;border-width:3px 3px 0 0}
.reticula i:nth-child(3){left:0;bottom:0;border-width:0 0 3px 3px}.reticula i:nth-child(4){right:0;bottom:0;border-width:0 3px 3px 0}
.explotada .reticula{opacity:0}
.corte{position:absolute;inset:-40%;pointer-events:none;z-index:5;display:none}
.corte i{position:absolute;left:0;right:0;height:34%;top:33%;transform:rotate(-14deg) translateX(-130%)}
.corte i:nth-child(1){background:var(--acc)}
.corte i:nth-child(2){background:var(--crema);height:5%;top:62%}
.corte.va{display:block}
.corte.va i{animation:corte var(--d-del) var(--c-std) forwards}
.corte.va i:nth-child(2){animation-delay:40ms}
@keyframes corte{0%{transform:rotate(-14deg) translateX(-130%)}45%{transform:rotate(-14deg) translateX(0)}100%{transform:rotate(-14deg) translateX(130%)}}
.llamadas{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity var(--d-std) var(--c-sal)}
.explotada .llamadas{opacity:1;transition-delay:var(--d-rap)}
.llamadas svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.llamadas path{fill:none;stroke:color-mix(in srgb,var(--crema) 45%,transparent);stroke-width:1.5}
.llamadas circle{fill:var(--ink);stroke:var(--acc);stroke-width:2}
.llamadas path.on{stroke:var(--acc)}.llamadas path.mal{stroke:var(--bad)}
.llamada{position:absolute;display:flex;align-items:center;gap:8px;height:26px;padding:0 10px;background:var(--panel);font:900 13px var(--disp);font-stretch:condensed;
  text-transform:uppercase;white-space:nowrap;transform:translateY(-50%) rotate(-3deg);clip-path:polygon(0 0,100% 8%,97% 100%,2% 92%)}
.llamada span{font:800 11px var(--mono);color:var(--acc)}
.llamada.on{background:var(--crema);color:var(--ink)}.llamada.on span{color:var(--ink)}
.llamada.mal{background:var(--bad);color:var(--crema)}.llamada.mal span{color:var(--crema)}
.vacio{font:700 15px var(--disp);color:var(--txt-dim);text-align:center;line-height:1.7;padding:20px}

/* ── tiempo de la tipografía cinética ─────────────────────────────────── */
#zTiempo{display:flex;align-items:center;gap:14px}
.play{width:32px;height:32px;flex:none;border-radius:50%;background:var(--crema);color:var(--ink);display:grid;place-items:center;transition:transform var(--d-micro)}
.play:active{transform:scale(.9)}
.pista{position:relative;flex:1;height:28px;cursor:pointer;touch-action:none}
.pista .riel-t{position:absolute;left:0;right:0;top:13px;height:3px;background:var(--line);border-radius:2px}
.pista .lleno{position:absolute;left:0;right:0;top:13px;height:3px;background:var(--acc);transform-origin:0 50%;border-radius:2px}
.pista .marcas-p i{position:absolute;top:9px;width:2px;height:11px;background:var(--txt-dim)}
.pista .cabeza{position:absolute;top:5px;width:18px;height:18px;margin-left:-9px;background:var(--acc);transform:rotate(45deg);box-shadow:3px 3px 0 #000}
#zTiempo .t{font:800 12px var(--mono);color:var(--txt-dim);width:52px}

/* ── acciones como botones de control ─────────────────────────────────── */
#zAcciones{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;height:40px;padding:0 13px 0 6px;border-radius:999px;font:900 15px var(--disp);
  font-stretch:condensed;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;transition:transform var(--d-micro),background var(--d-micro)}
.btn kbd{min-width:28px;height:28px;padding:0 6px;border-radius:50%;background:var(--crema);color:var(--ink);display:grid;place-items:center}
.btn:hover{background:var(--panel)}
.btn:active{transform:scale(.95)}
.btn.prim{background:var(--acc);color:var(--ink);box-shadow:var(--sombra);padding-right:18px}
.btn.prim kbd{background:var(--ink);color:var(--acc)}
.btn.prim[aria-disabled=true]{background:var(--panel);color:var(--txt-dim);box-shadow:none;cursor:not-allowed}
.btn.prim[aria-disabled=true] kbd{background:var(--bad);color:var(--crema)}
.btn.sec{background:var(--crema);color:var(--ink)}.btn.sec kbd{background:var(--ink);color:var(--crema)}
.btn .onda{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:onda var(--d-del) var(--c-sal) forwards;pointer-events:none}
@keyframes onda{to{transform:scale(1);opacity:0}}
.btn.listo::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;background:var(--good);color:var(--ink);font-size:20px;animation:listo 1.2s var(--c-std) forwards}
@keyframes listo{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* ── Karen (arriba a la derecha): su ESTADO, no puntaje ───────────────── */
#karenBox{padding:14px 14px 12px;overflow:auto}
#karenBox .cab{color:var(--acc);margin-bottom:8px}
.karen .top{display:flex;align-items:center;gap:12px;position:relative}
.hex{width:50px;height:56px;flex:none;background:var(--acc);color:var(--ink);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font-size:24px;transition:background var(--d-std)}
.veredicto{font:900 clamp(24px,2.2vw,36px)/.9 var(--disp);font-stretch:condensed;text-transform:uppercase}
.veredicto small{display:block;font:600 12px system-ui,sans-serif;text-transform:none;color:var(--txt-dim);margin-top:4px}
.segs{display:flex;gap:5px;margin-top:12px}
.segs button{flex:1;height:10px;background:var(--acc);transform:skewX(-24deg);transition:transform var(--d-micro),background var(--d-std)}
.segs button:hover{transform:skewX(-24deg) scaleY(1.6)}
.segs button.no{background:var(--bad)}
.karen.frena .hex{background:var(--bad);color:var(--crema)}
.fallas{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.falla{display:block;text-align:left;padding:8px 10px;background:var(--bad);color:var(--crema);clip-path:polygon(0 0,100% 4%,98% 100%,1% 96%);transition:transform var(--d-micro)}
.falla:hover{transform:translateX(-4px)}
.falla b{font:800 10px var(--mono);letter-spacing:.12em;display:block}
.falla span{font:700 12px/1.3 system-ui,sans-serif}

/* ── ficha (TINTA): el bocadillo crema · pieza o capa, editable ───────── */
#ficha{overflow:auto;background:var(--crema);color:var(--ink);border-radius:20px;padding:18px 18px 16px;box-shadow:var(--sombra);user-select:text}
.ficha .tag{font:800 10px var(--mono);letter-spacing:.16em;color:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;gap:8px;align-items:center}

.ficha h2{font:900 24px/.95 var(--disp);font-stretch:condensed;text-transform:uppercase;margin:6px 0 8px;word-break:break-word}
.ficha p{font:600 12.5px/1.35 system-ui,sans-serif;color:color-mix(in srgb,var(--ink) 75%,transparent)}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin-top:10px;font:600 12.5px system-ui,sans-serif;align-items:center}
.ficha dt{font:800 10px var(--mono);letter-spacing:.1em;color:color-mix(in srgb,var(--ink) 55%,transparent)}
.ficha dd{word-break:break-word;min-width:0}
.ficha .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.ficha label.campo{display:block;margin-top:10px;font:800 10px var(--mono);letter-spacing:.1em;color:color-mix(in srgb,var(--ink) 60%,transparent)}
.ficha textarea,.ficha input[type=text]{display:block;width:100%;margin-top:4px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);padding:7px 9px;font:600 13px/1.3 system-ui,sans-serif;resize:vertical}
.ficha input[type=color]{width:44px;height:30px;border:2px solid var(--ink);border-radius:8px;padding:0;background:none;vertical-align:middle;margin-right:8px}
.ficha input[type=range]{width:100%;accent-color:var(--ink)}
.ficha .fila-c{display:flex;align-items:center;gap:8px;margin-top:4px;font:700 12px var(--mono)}
.ficha .ops{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ficha .ops button{height:32px;padding:0 11px;border-radius:9px;background:var(--ink);color:var(--crema);font:900 13px var(--disp);text-transform:uppercase;letter-spacing:.04em}
.ficha .ops button.quita{background:var(--bad)}
.ficha .ops button[disabled]{opacity:.35;cursor:not-allowed}
.ficha .chk{display:flex;align-items:center;gap:6px;margin-top:8px;font:700 12px system-ui}
.bar{display:flex;align-items:center;gap:8px}.bar u{flex:1;height:5px;background:color-mix(in srgb,var(--ink) 14%,transparent);text-decoration:none;position:relative}
.bar u i{position:absolute;top:0;bottom:0;background:var(--ink)}.bar em{font:800 11px var(--mono);font-style:normal;width:30px;text-align:right}
.f2{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--ink);color:var(--crema)}
.f2 b{font:800 10px var(--mono);letter-spacing:.14em;color:var(--acc);display:block;margin-top:6px}
.f2 b:first-child{margin-top:0}
.f2 textarea{background:#11151c;color:var(--crema);border-color:var(--line)}

/* ── CP-6 · aviso ─────────────────────────────────────────────────────── */
.aviso{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px) rotate(-2deg);opacity:0;pointer-events:none;background:var(--bad);color:var(--crema);
  padding:12px 18px;font:700 14px system-ui,sans-serif;box-shadow:var(--sombra);transition:opacity var(--d-mod),transform var(--d-mod) var(--c-sal);max-width:min(70vw,640px);z-index:60}
.aviso.ok{background:var(--good);color:var(--ink)}
.aviso.on{opacity:1;transform:translate(-50%,0) rotate(-2deg)}

/* ── CP-4 · ventanas flotantes (lote · activo · guardar) ───────────────── */
.velo{position:fixed;inset:0;background:rgba(5,6,9,.82);display:none;place-items:center;z-index:50}
.velo.on{display:grid}
.ventana{position:relative;width:min(1180px,94vw);max-height:90vh;overflow:auto;background:var(--panel);padding:28px 30px;border-radius:24px;box-shadow:10px 10px 0 #000;animation:entra var(--d-std) var(--c-sal)}
.ventana.chica{width:min(760px,94vw)}
@keyframes entra{from{transform:translateY(24px) rotate(-1deg);opacity:0}}
.ventana header{display:flex;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-bottom:20px}
.ventana h3{font:900 30px/.95 var(--disp);font-stretch:condensed;text-transform:uppercase}
.ventana p{color:var(--txt-dim);font:600 13px/1.45 system-ui}
.total{font:900 90px/.8 var(--disp);font-stretch:condensed;color:var(--acc)}
.total small{display:block;font:800 12px var(--mono);letter-spacing:.2em;color:var(--txt-dim);margin-top:10px}
.desglose{display:flex;gap:22px;flex-wrap:wrap}
.desglose div{font:800 11px var(--mono);letter-spacing:.12em;color:var(--txt-dim)}
.desglose b{display:block;font:900 30px var(--disp);color:var(--crema);letter-spacing:0}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;align-items:end}
.mini-l{text-align:center;animation:salta var(--d-std) var(--c-sal) backwards}
@keyframes salta{from{transform:translateY(14px) scale(.94);opacity:0}}
.mini-l img{max-width:100%;max-height:170px;border-radius:8px;border:4px solid var(--crema);box-shadow:5px 5px 0 #000;display:block;margin:0 auto}
.mini-l span{display:block;margin-top:8px;font:900 13px var(--disp);letter-spacing:.1em;color:var(--good)}
.mini-l small{display:block;font:800 10px var(--mono);color:var(--txt-dim)}
.mini-l.no img{border-color:var(--bad)}.mini-l.no span{color:var(--bad)}
.ventana footer{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:12px;margin-top:22px}
.activo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px}
.activo .ver{border-radius:14px;min-height:240px;max-height:56vh;display:grid;place-items:center;overflow:hidden;
  background-image:linear-gradient(45deg,#151a22 25%,transparent 25%,transparent 75%,#151a22 75%),linear-gradient(45deg,#151a22 25%,transparent 25%,transparent 75%,#151a22 75%);background-size:16px 16px;background-position:0 0,8px 8px;background-color:#0a0c10}
.activo .ver img{max-width:100%;max-height:56vh;object-fit:contain}
.activo dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:12px;font:600 13px system-ui;user-select:text}
.activo dt{font:800 10px var(--mono);letter-spacing:.12em;color:var(--txt-dim)}
.activo dd{word-break:break-word}
.porque{margin-top:12px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--bad) 25%,transparent);font:700 13px system-ui}
.guardar input[type=text]{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--crema);padding:0 12px;margin:12px 0;user-select:text}

/* ── dique y hojas extra (sólo teléfono) ───────────────────────────────── */
.dique,#zCapasHoja,#karenFallas{display:none}

/* pantallas medianas */
@media (max-width:1280px) and (min-width:761px){.btn{font-size:13px;height:36px}.btn kbd{min-width:24px;height:24px}.titulo h1{font-size:28px}}

@media (max-width:760px){
  .agua{display:none}

    z-index:40;display:none!important;border-radius:20px 20px 0 0;clip-path:none;box-shadow:0 -10px 40px #000}

  .dique button b{font:900 18px var(--disp);color:var(--crema)}

/* ── orden E9 · el PRIMER MINUTO de un vendedor nuevo: 1 plantilla → 2 material → 3 exportar; inventario grande; la jerga, a «Avanzado» ── */
.pasos{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:6;display:flex;gap:4px;padding:4px;border-radius:12px;background:#0b0e13e6;border:1px solid var(--line);box-shadow:0 6px 18px #0008}
.pasos button{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 6px;border-radius:9px;font:800 13px system-ui,sans-serif;color:var(--txt-dim);white-space:nowrap}
.pasos button i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:900 12px var(--mono);font-style:normal;background:var(--line);color:var(--crema)}
.pasos button.on{background:var(--acc);color:var(--ink)}.pasos button.on i{background:var(--ink);color:var(--acc)}
.pasos button.hecho{color:var(--crema)}.pasos button.hecho i{background:#37c7b5;color:var(--ink)}
.pasos button:hover{color:var(--crema)}
.est.sin:not(.on){display:none}
.rejas{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile b{font:700 12px/1.2 system-ui,sans-serif;max-height:2.5em}
.tile.plant .mini{padding:0;background:#0a0c10;aspect-ratio:9/12}
.tile.plant canvas{width:100%;height:100%;display:block;object-fit:contain}
.tile.plant em{display:none}
#zInventario .guia-inv{font:700 12px/1.35 system-ui,sans-serif;color:var(--crema);background:#d4b24c22;border-left:3px solid var(--acc);padding:6px 8px;border-radius:6px}
details.avanzado{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
details.avanzado>summary{cursor:pointer;font:800 11px var(--mono);letter-spacing:.1em;color:var(--txt-dim);list-style:none}
details.avanzado>summary::before{content:"▸ "}details.avanzado[open]>summary::before{content:"▾ "}
.btn.ter{opacity:.72;font-size:13px}
.btn.prim{font-size:17px}
@media (hover:none){.btn kbd{display:none}}
@media (max-width:760px){.hoja.abierta{z-index:80!important;background:#10141b!important}#bPng{order:-1}.pasos{top:4px}.pasos button{height:30px;padding:0 9px 0 5px;font-size:12px}.pasos button span{display:none}.pasos button.on span{display:inline}}

/* ── orden E19 · el Composer fácil: la columna cambia con Plantillas · Textos · Props · Imágenes; la pieza a la derecha ── */
#zInventario{padding-bottom:8px}
.modos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.modos button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:10px;background:var(--ink);border:1px solid var(--line);font:900 13px var(--disp);font-stretch:condensed;text-transform:uppercase;letter-spacing:.04em;color:var(--txt-dim)}
.modos button b{font:900 18px var(--disp);color:var(--crema)}
.modos button.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}.modos button.on b{color:var(--ink)}
.modos button:hover{border-color:var(--acc)}
#zInventario[data-modo=plantillas] #estantes,#zInventario[data-modo=plantillas] #busca,#zInventario[data-modo=props] #estantes{display:none}

.textos h4{font:800 10px var(--mono);letter-spacing:.2em;color:var(--txt-dim);margin-top:4px}

.mock-v{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px}

.mock-v canvas{max-width:100%;max-height:52vh;display:block}
.disp{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.disp button{height:36px;padding:0 14px;border-radius:10px;background:var(--ink);border:1px solid var(--line);font:900 14px var(--disp);text-transform:uppercase}
.disp button.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}

.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;max-height:190px;overflow:auto;margin-top:6px}

}

<div class="app" id="app">

  var ruta = ('/' + (item.ruta || item.carpeta || '')).toLowerCase();
  if(regla.tipo && regla.tipo.indexOf(item.tipo) >= 0) return true;
  if(regla.etapa && regla.etapa.indexOf(item.etapa) >= 0) return true;
  if(regla.etapa_y_segmento && item.etapa === regla.etapa_y_segmento[0] && regla.etapa_y_segmento[1].indexOf(item.segmento) >= 0) return true;
  if(regla.carpeta && regla.carpeta.some(function(c){ return ruta.indexOf(c) >= 0; })) return true;
  return false;
}

    else if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); var cs = ARBOL.children.slice().sort(function(a, b){ return b.data.z - a.data.z; }),
      j = cs.findIndex(function(n){ return n.nid === ESTADO.capa; }), dd = e.key === 'ArrowRight' ? 1 : -1;
      ESTADO.capa = cs[j < 0 ? (dd > 0 ? 0 : cs.length - 1) : (j + dd + cs.length) % cs.length].nid; marcarSeleccion(); }
